name: Current Android Test Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: current-android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-current-test:
    name: Build TEST THIS APK candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      SOURCE_SHA: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Unity license configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${UNITY_LICENSE:-}" && -z "${UNITY_SERIAL:-}" ]]; then
            echo "::error::Configure UNITY_LICENSE for Unity Personal, or UNITY_SERIAL for a paid Unity license."
            exit 1
          fi
          if [[ -z "${UNITY_EMAIL:-}" || -z "${UNITY_PASSWORD:-}" ]]; then
            echo "::error::GameCI Unity Builder requires UNITY_EMAIL and UNITY_PASSWORD together with UNITY_LICENSE/UNITY_SERIAL."
            exit 1
          fi

      - name: Restore incremental Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-Full-v2-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.sha }}
          restore-keys: |
            Library-Android-Full-v2-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-Android-Fast-v2-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-Android-Full-v1-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-Android-Fast-v1-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-CurrentAndroidTest-v5-

      - name: Generate, validate, and build current Android test APK
        id: unity-build
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ env.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ env.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ env.UNITY_SERIAL }}
        with:
          targetPlatform: Android
          unityVersion: auto
          buildMethod: BeyondTheBeat.Editor.Phase6BuildAutomation.BuildAndroid
          buildName: BeyondTheBeat-TEST-${{ github.run_number }}
          buildsPath: build
          versioning: Custom
          version: 0.6.${{ github.run_number }}
          androidVersionCode: ${{ github.run_number }}
          androidExportType: androidPackage
          allowDirtyBuild: true

      - name: Print current-build diagnostics
        if: always()
        shell: bash
        run: |
          echo "=== Beyond The Beat current Android test diagnostics ==="
          for DIAGNOSTICS in \
            "${GITHUB_WORKSPACE}/build/phase6-ci-diagnostics.log" \
            "${GITHUB_WORKSPACE}/build/phase6-build-size-report.txt" \
            "${GITHUB_WORKSPACE}/build/store-assets/STORE-ASSET-MANIFEST.txt" \
            "${GITHUB_WORKSPACE}/build/device-matrix/DEVICE-MATRIX-STATUS.txt" \
            "${GITHUB_WORKSPACE}/build/phase5-ci-diagnostics.log"; do
            if [[ -f "${DIAGNOSTICS}" ]]; then
              echo "--- ${DIAGNOSTICS} ---"
              cat "${DIAGNOSTICS}" | tail -n 320
            fi
          done

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FAILED-BUILD-DIAGNOSTICS-${{ github.run_number }}
          path: |
            build/phase6-ci-diagnostics.log
            build/phase6-build-size-report.txt
            build/store-assets/**
            build/device-matrix/**
            build/phase5-ci-diagnostics.log
            build/phase4-ci-diagnostics.log
            build/phase3-ci-diagnostics.log
            build/phase2-ci-diagnostics.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Create TEST THIS BUILD manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_APK="BeyondTheBeat-TEST-${GITHUB_RUN_NUMBER}.apk"
          APK_PATH="$(find "${GITHUB_WORKSPACE}" -type f -name "${EXPECTED_APK}" -not -path "${GITHUB_WORKSPACE}/artifact/*" -not -path "${GITHUB_WORKSPACE}/Library/*" -print -quit)"
          if [[ -z "${APK_PATH}" ]]; then
            APK_PATH="$(find "${GITHUB_WORKSPACE}" -type f -name '*.apk' -not -path "${GITHUB_WORKSPACE}/artifact/*" -not -path "${GITHUB_WORKSPACE}/Library/*" -print -quit)"
          fi
          if [[ -z "${APK_PATH}" || ! -f "${APK_PATH}" ]]; then
            echo "::error::Unity completed without a discoverable current Android test APK."
            find "${GITHUB_WORKSPACE}" -type f -name '*.apk' -print || true
            exit 1
          fi

          SIZE_REPORT="${GITHUB_WORKSPACE}/build/phase6-build-size-report.txt"
          if [[ ! -f "${SIZE_REPORT}" ]]; then
            echo "::error::Phase 6 build-size report was not generated."
            exit 1
          fi

          STORE_ASSETS_DIR="${GITHUB_WORKSPACE}/build/store-assets"
          for REQUIRED_STORE_FILE in \
            "play-store-icon-512.png" \
            "feature-graphic-1024x500.png" \
            "STORE-ASSET-MANIFEST.txt" \
            "PLAY-STORE-LISTING.md" \
            "SCREENSHOT-CAPTURE-REQUIRED.txt"; do
            if [[ ! -f "${STORE_ASSETS_DIR}/${REQUIRED_STORE_FILE}" ]]; then
              echo "::error::Missing generated store asset: ${REQUIRED_STORE_FILE}"
              exit 1
            fi
          done

          DEVICE_MATRIX_DIR="${GITHUB_WORKSPACE}/build/device-matrix"
          for REQUIRED_MATRIX_FILE in \
            "DEVICE-MATRIX-TEST-PLAN.md" \
            "DEVICE-MATRIX-EVIDENCE.csv" \
            "DEVICE-MATRIX-STATUS.txt"; do
            if [[ ! -f "${DEVICE_MATRIX_DIR}/${REQUIRED_MATRIX_FILE}" ]]; then
              echo "::error::Missing generated device-matrix file: ${REQUIRED_MATRIX_FILE}"
              exit 1
            fi
          done

          TARGET_API="$(awk -F= '/^targetApi=/{print $2; exit}' "${DEVICE_MATRIX_DIR}/DEVICE-MATRIX-STATUS.txt")"
          PHYSICAL_EVIDENCE="$(awk -F= '/^physicalEvidence=/{print $2; exit}' "${DEVICE_MATRIX_DIR}/DEVICE-MATRIX-STATUS.txt")"
          if [[ "${TARGET_API}" != "36" ]]; then
            echo "::error::Current Google Play readiness gate requires target API 36; device-matrix status reported '${TARGET_API}'."
            exit 1
          fi
          if [[ "${PHYSICAL_EVIDENCE}" != "PENDING" ]]; then
            echo "::error::Fresh CI-generated device matrix must start with physical evidence PENDING, not '${PHYSICAL_EVIDENCE}'."
            exit 1
          fi

          STAGE_DIR="${GITHUB_WORKSPACE}/artifact/TestThisBuild"
          rm -rf "${STAGE_DIR}"
          mkdir -p "${STAGE_DIR}/STORE-ASSETS" "${STAGE_DIR}/DEVICE-MATRIX"
          APK_FILE="BeyondTheBeat-TEST-${GITHUB_RUN_NUMBER}.apk"
          STAGED_APK="${STAGE_DIR}/${APK_FILE}"
          cp "${APK_PATH}" "${STAGED_APK}"
          cp "${SIZE_REPORT}" "${STAGE_DIR}/BUILD-SIZE-REPORT.txt"
          cp -R "${STORE_ASSETS_DIR}/." "${STAGE_DIR}/STORE-ASSETS/"
          cp -R "${DEVICE_MATRIX_DIR}/." "${STAGE_DIR}/DEVICE-MATRIX/"

          BUDGET_ASSET="${GITHUB_WORKSPACE}/Assets/Settings/Performance/Phase6_MobilePerformanceBudget.asset"
          if [[ ! -f "${BUDGET_ASSET}" ]]; then
            echo "::error::Phase 6 performance budget asset was not generated."
            exit 1
          fi
          MAX_APK_MB="$(awk '/maximumApkSizeMb:/{print $2; exit}' "${BUDGET_ASSET}")"
          if [[ -z "${MAX_APK_MB}" || ! "${MAX_APK_MB}" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to read maximumApkSizeMb from Phase 6 performance budget."
            exit 1
          fi

          APK_BYTES="$(stat -c%s "${STAGED_APK}")"
          MAX_APK_BYTES="$((MAX_APK_MB * 1024 * 1024))"
          APK_MB="$(awk -v bytes="${APK_BYTES}" 'BEGIN { printf "%.2f", bytes / 1048576 }')"
          if (( APK_BYTES > MAX_APK_BYTES )); then
            echo "::error::APK size ${APK_MB} MB exceeds Phase 6 soft-launch ceiling ${MAX_APK_MB} MB."
            exit 1
          fi

          BUILD_REPORT_MB="$(awk -F= '/^totalMiB=/{print $2; exit}' "${SIZE_REPORT}")"
          MANAGED_STRIPPING="$(awk -F= '/^managedStripping=/{print $2; exit}' "${SIZE_REPORT}")"
          ANDROID_ARCHS="$(awk -F= '/^androidArchitectures=/{print $2; exit}' "${SIZE_REPORT}")"

          APK_SHA256="$(sha256sum "${STAGED_APK}" | awk '{print $1}')"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          UNITY_VERSION="$(awk -F': ' '/^m_EditorVersion:/{print $2; exit}' "${GITHUB_WORKSPACE}/ProjectSettings/ProjectVersion.txt")"
          printf '%s  %s\n' "${APK_SHA256}" "${APK_FILE}" > "${STAGE_DIR}/SHA256SUMS.txt"

          cat > "${STAGE_DIR}/INSTALL-THIS-BUILD.txt" <<EOF
          BEYOND THE BEAT — INSTALL THIS BUILD

          APK: ${APK_FILE}
          Artifact: TEST-THIS-BUILD-${GITHUB_RUN_NUMBER}
          Source commit: ${SOURCE_SHA}
          SHA-256: ${APK_SHA256}
          APK size: ${APK_MB} MB / ${MAX_APK_MB} MB ceiling
          Target SDK: Android 16 / API ${TARGET_API}
          Unity BuildReport size: ${BUILD_REPORT_MB:-unknown} MiB
          Managed stripping: ${MANAGED_STRIPPING:-unknown}
          Android architectures: ${ANDROID_ARCHS:-unknown}
          Unity: ${UNITY_VERSION}
          Workflow: ${RUN_URL}

          This is the ONLY APK intended for current device testing.
          STORE-ASSETS/ contains the current Play icon, feature graphic, listing draft and screenshot capture requirements.
          DEVICE-MATRIX/ contains the required physical test plan and 36 PENDING evidence rows (3 lanes x 12 scenarios).
          CI success is not physical Android, device-matrix, or store-publishing sign-off.

          Phase 6 DEVICE MATRIX + STORE priorities:
          1. Open DEVICE-MATRIX/DEVICE-MATRIX-TEST-PLAN.md and assign real devices for legacy/API30, mainstream/API33 and current/API36 lanes.
          2. Use at least 3 physical phones across at least 2 manufacturers; emulator-only evidence does NOT count for sign-off.
          3. For every lane, complete all 12 DM scenarios and update DEVICE-MATRIX/DEVICE-MATRIX-EVIDENCE.csv from PENDING to PASS/FAIL with device/test evidence.
          4. Clean-install and cold-launch; verify the generated launcher icon is visible and no stripping/missing-script startup failure occurs.
          5. Complete Steer -> GO -> REV -> ACTION, LEFT/RIGHT/GO/REV/ACTION multitouch, Parking/Cook/Repair/Mechanic Job, mission/save, forest survival and restricted puzzle flows.
          6. Confirm DRIVE -> SWIM TEST -> DRIVE, SWIM/BACK/DIVE/SURFACE and camera handoff still work.
          7. Record resolution/aspect/cutout/navigation details and verify Mission/Tutorial/Performance/Mechanic/interaction HUD safe-area readability.
          8. Run at least a 15-minute mixed gameplay soak; record FPS/frame-time and thermal observations, especially on the mainstream mid-range lane.
          9. Capture REAL gameplay screenshots following STORE-ASSETS/SCREENSHOT-CAPTURE-REQUIRED.txt; minimum 2, target at least 3 landscape 16:9 captures at 1920x1080+.
          10. Review STORE-ASSETS/PLAY-STORE-LISTING.md for factual accuracy and BUILD-SIZE-REPORT.txt for size regressions.
          11. APK package size must remain <= ${MAX_APK_MB} MB; this build is ${APK_MB} MB.
          12. CI GREEN IS NOT DEVICE-MATRIX SIGN-OFF: the next release-candidate milestone is blocked until physical evidence is complete.
          EOF

          {
            echo "artifact_name=TEST-THIS-BUILD-${GITHUB_RUN_NUMBER}"
            echo "apk_path=artifact/TestThisBuild/${APK_FILE}"
            echo "sha256=${APK_SHA256}"
            echo "apk_size_mb=${APK_MB}"
            echo "apk_limit_mb=${MAX_APK_MB}"
            echo "target_api=${TARGET_API}"
            echo "build_report_mb=${BUILD_REPORT_MB:-unknown}"
            echo "managed_stripping=${MANAGED_STRIPPING:-unknown}"
            echo "store_assets_path=artifact/TestThisBuild/STORE-ASSETS"
            echo "device_matrix_path=artifact/TestThisBuild/DEVICE-MATRIX"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload TEST THIS BUILD APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.manifest.outputs.artifact_name }}
          path: |
            artifact/TestThisBuild/BeyondTheBeat-TEST-${{ github.run_number }}.apk
            artifact/TestThisBuild/INSTALL-THIS-BUILD.txt
            artifact/TestThisBuild/SHA256SUMS.txt
            artifact/TestThisBuild/BUILD-SIZE-REPORT.txt
            artifact/TestThisBuild/STORE-ASSETS/**
            artifact/TestThisBuild/DEVICE-MATRIX/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Write workflow summary
        shell: bash
        run: |
          {
            echo "# INSTALL THIS APK"
            echo
            echo "- Artifact: **${{ steps.manifest.outputs.artifact_name }}**"
            echo "- APK: **${{ steps.manifest.outputs.apk_path }}**"
            echo "- Target SDK: **Android 16 / API ${{ steps.manifest.outputs.target_api }}**"
            echo "- Store assets: **${{ steps.manifest.outputs.store_assets_path }}**"
            echo "- Device matrix: **${{ steps.manifest.outputs.device_matrix_path }}**"
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- SHA-256: \`${{ steps.manifest.outputs.sha256 }}\`"
            echo "- APK size: **${{ steps.manifest.outputs.apk_size_mb }} MB / ${{ steps.manifest.outputs.apk_limit_mb }} MB**"
            echo "- Unity BuildReport size: **${{ steps.manifest.outputs.build_report_mb }} MiB**"
            echo "- Managed stripping: **${{ steps.manifest.outputs.managed_stripping }}**"
            echo
            echo "This workflow starts automatically when changes land on main, including PR merge commits, and can also be started manually."
            echo "It performs Phase 5 regression, Phase 6 performance + quality + onboarding + UI polish + store asset generation + Android API 36/device-matrix preparation + stripping/build-size optimization, Android Player build and the 200 MB APK gate."
            echo "DEVICE-MATRIX evidence is intentionally PENDING after CI generation. Physical testing on >=3 phones / >=2 OEMs is mandatory before the final release-candidate gate."
          } >> "${GITHUB_STEP_SUMMARY}"
