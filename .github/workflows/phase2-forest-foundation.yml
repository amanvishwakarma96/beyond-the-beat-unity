name: Phase 2 Reach + Survive Android

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/phase2-forest-foundation.yml'
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - 'Docs/**'

permissions:
  contents: read

concurrency:
  group: phase2-reach-survive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-reach-survive:
    name: Build Phase 2 Reach + Survive APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Unity license configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${UNITY_LICENSE:-}" && -z "${UNITY_SERIAL:-}" ]]; then
            echo "::error::Configure UNITY_LICENSE for Unity Personal, or UNITY_SERIAL for a paid Unity license."
            exit 1
          fi

          if [[ -z "${UNITY_EMAIL:-}" || -z "${UNITY_PASSWORD:-}" ]]; then
            echo "::error::GameCI Unity Builder requires UNITY_EMAIL and UNITY_PASSWORD together with UNITY_LICENSE/UNITY_SERIAL."
            exit 1
          fi

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Phase2-ReachSurvive-v1-${{ hashFiles('Assets/**/*.cs', 'Assets/**/*.asmdef', 'Assets/**/*.asmref', 'Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}

      - name: Generate, validate, and build Phase 2 Reach + Survive APK
        id: unity-build
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ env.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ env.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ env.UNITY_SERIAL }}
        with:
          targetPlatform: Android
          unityVersion: auto
          buildMethod: BeyondTheBeat.Editor.Phase2BuildAutomation.BuildAndroid
          buildName: BeyondTheBeat-Phase2-ReachSurvive-${{ github.run_number }}
          buildsPath: build
          versioning: Custom
          version: 0.2.${{ github.run_number }}
          androidVersionCode: ${{ github.run_number }}
          androidExportType: androidPackage
          allowDirtyBuild: true

      - name: Print Phase 2 diagnostics
        if: always()
        shell: bash
        run: |
          echo "=== Beyond The Beat Phase 2 Reach + Survive diagnostics ==="
          DIAGNOSTICS="${GITHUB_WORKSPACE}/build/phase2-ci-diagnostics.log"
          if [[ -f "${DIAGNOSTICS}" ]]; then
            grep -E '\[Beyond The Beat\]|Exception|BuildResult|FAIL|PASS' "${DIAGNOSTICS}" || true
            echo "--- diagnostics tail ---"
            tail -n 360 "${DIAGNOSTICS}"
          else
            echo "No Phase 2 diagnostics file was produced."
          fi

      - name: Upload Phase 2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Phase2-ReachSurvive-CI-Diagnostics-${{ github.run_number }}
          path: build/phase2-ci-diagnostics.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Create Phase 2 Reach + Survive artifact manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_APK="BeyondTheBeat-Phase2-ReachSurvive-${GITHUB_RUN_NUMBER}.apk"
          APK_PATH="$(find "${GITHUB_WORKSPACE}" \
            -type f \
            -name "${EXPECTED_APK}" \
            -not -path "${GITHUB_WORKSPACE}/artifact/*" \
            -not -path "${GITHUB_WORKSPACE}/Library/*" \
            -print -quit)"

          if [[ -z "${APK_PATH}" ]]; then
            APK_PATH="$(find "${GITHUB_WORKSPACE}" \
              -type f \
              -name '*.apk' \
              -not -path "${GITHUB_WORKSPACE}/artifact/*" \
              -not -path "${GITHUB_WORKSPACE}/Library/*" \
              -print -quit)"
          fi

          if [[ -z "${APK_PATH}" || ! -f "${APK_PATH}" ]]; then
            echo "::error::Unity completed without a discoverable Phase 2 Reach + Survive APK."
            find "${GITHUB_WORKSPACE}" -type f -name '*.apk' -print || true
            exit 1
          fi

          STAGE_DIR="${GITHUB_WORKSPACE}/artifact/Phase2ReachSurvive"
          rm -rf "${STAGE_DIR}"
          mkdir -p "${STAGE_DIR}"

          APK_FILE="BeyondTheBeat-Phase2-ReachSurvive-${GITHUB_RUN_NUMBER}.apk"
          STAGED_APK="${STAGE_DIR}/${APK_FILE}"
          cp "${APK_PATH}" "${STAGED_APK}"

          APK_SIZE_BYTES="$(stat -c%s "${STAGED_APK}")"
          APK_SHA256="$(sha256sum "${STAGED_APK}" | awk '{print $1}')"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          UNITY_VERSION="$(awk -F': ' '/^m_EditorVersion:/{print $2; exit}' "${GITHUB_WORKSPACE}/ProjectSettings/ProjectVersion.txt")"

          printf '%s  %s\n' "${APK_SHA256}" "${APK_FILE}" > "${STAGE_DIR}/SHA256SUMS.txt"

          cat > "${STAGE_DIR}/Phase2-ReachSurvive-Artifact-Manifest.txt" <<EOF
          Beyond The Beat — Phase 2 Reach + Survive Artifact
          Artifact name: BeyondTheBeat-Phase2-ReachSurvive-${GITHUB_RUN_NUMBER}
          APK file: ${APK_FILE}
          APK size (bytes): ${APK_SIZE_BYTES}
          SHA-256: ${APK_SHA256}
          Source commit SHA: ${SOURCE_SHA}
          Workflow checkout SHA: ${GITHUB_SHA}
          GitHub Actions run: ${RUN_URL}
          Unity version: ${UNITY_VERSION}
          Build type: Unity Development APK
          Generated UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          Scope: Phase 2 Issue #37 data-driven Reach + Survive mission on top of Issues #35 and #36.
          Validation covers Reach Location regression, target-zone gating, continuous survival duration, exit reset, depletion failure, and HUD progress presentation.
          Final Phase 2 persistence/integration/performance/device validation remains Issue #38.
          Phase 1 Issue #30 still requires physical Android sign-off; Phase 2 development is proceeding by explicit project-owner instruction.
          EOF

          {
            echo "artifact_name=BeyondTheBeat-Phase2-ReachSurvive-${GITHUB_RUN_NUMBER}"
            echo "apk_path=artifact/Phase2ReachSurvive/${APK_FILE}"
            echo "sha256=${APK_SHA256}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload Phase 2 Reach + Survive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.manifest.outputs.artifact_name }}
          path: |
            artifact/Phase2ReachSurvive/BeyondTheBeat-Phase2-ReachSurvive-${{ github.run_number }}.apk
            artifact/Phase2ReachSurvive/Phase2-ReachSurvive-Artifact-Manifest.txt
            artifact/Phase2ReachSurvive/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Write workflow summary
        shell: bash
        run: |
          {
            echo "## Beyond The Beat — Phase 2 Reach + Survive"
            echo
            echo "- Artifact: \`${{ steps.manifest.outputs.artifact_name }}\`"
            echo "- APK: \`${{ steps.manifest.outputs.apk_path }}\`"
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- SHA-256: \`${{ steps.manifest.outputs.sha256 }}\`"
            echo "- Scope: Issue #37 Reach + Survive mission; final Phase 2 exit remains #38."
            echo "- Phase 1 physical Android exit sign-off remains pending under Issue #30."
          } >> "${GITHUB_STEP_SUMMARY}"
