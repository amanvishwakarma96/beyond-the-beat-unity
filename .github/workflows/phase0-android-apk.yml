name: Phase 0 Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/phase0-android-apk.yml'
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'

permissions:
  contents: read

concurrency:
  group: phase0-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build shareable Phase 0 APK
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Unity license configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${UNITY_LICENSE:-}" && -z "${UNITY_SERIAL:-}" ]]; then
            echo "::error::Configure UNITY_LICENSE for Unity Personal, or UNITY_SERIAL for a paid Unity license."
            exit 1
          fi

          if [[ -z "${UNITY_EMAIL:-}" || -z "${UNITY_PASSWORD:-}" ]]; then
            echo "::error::GameCI Unity Builder requires UNITY_EMAIL and UNITY_PASSWORD together with UNITY_LICENSE/UNITY_SERIAL for activation. If your Unity account uses Google sign-in, create/reset a direct Unity ID password for the same email and store it only as a GitHub Actions secret."
            exit 1
          fi

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Phase0-Android-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-Phase0-Android-
            Library-

      - name: Generate, validate, and build Android development APK
        id: unity-build
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ env.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ env.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ env.UNITY_SERIAL }}
        with:
          targetPlatform: Android
          unityVersion: auto
          buildMethod: BeyondTheBeat.Editor.Phase0BuildAutomation.BuildAndroid
          buildName: BeyondTheBeat-Phase0-${{ github.run_number }}
          buildsPath: build
          versioning: Custom
          version: 0.0.${{ github.run_number }}
          androidVersionCode: ${{ github.run_number }}
          androidExportType: androidPackage
          allowDirtyBuild: true

      - name: Create artifact manifest and checksum
        id: manifest
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$(find build -type f -name 'BeyondTheBeat-Phase0-${{ github.run_number }}.apk' -print -quit)"
          if [[ -z "${APK_PATH}" ]]; then
            APK_PATH="$(find build -type f -name '*.apk' -print -quit)"
          fi

          if [[ -z "${APK_PATH}" || ! -f "${APK_PATH}" ]]; then
            echo "::error::Unity completed without a discoverable APK under build/."
            find build -maxdepth 4 -type f -print || true
            exit 1
          fi

          APK_DIR="$(dirname "${APK_PATH}")"
          APK_FILE="$(basename "${APK_PATH}")"
          APK_SIZE_BYTES="$(stat -c%s "${APK_PATH}")"
          APK_SHA256="$(sha256sum "${APK_PATH}" | awk '{print $1}')"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          printf '%s  %s\n' "${APK_SHA256}" "${APK_FILE}" > "${APK_DIR}/SHA256SUMS.txt"

          cat > "${APK_DIR}/Phase0-Artifact-Manifest.txt" <<EOF
          Beyond The Beat — Phase 0 Android Artifact
          Artifact name: BeyondTheBeat-Phase0-${GITHUB_RUN_NUMBER}
          APK file: ${APK_FILE}
          APK size (bytes): ${APK_SIZE_BYTES}
          SHA-256: ${APK_SHA256}
          Commit SHA: ${GITHUB_SHA}
          Git ref: ${GITHUB_REF}
          GitHub Actions run: ${RUN_URL}
          Unity version: 2022.3.76f1
          Build type: Unity Development APK
          Generated UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          IMPORTANT: Artifact generation does not equal Android device validation.
          Install/launch, touch controls, drive+park loop, FPS/stutter/GC, and device observations
          must still be recorded in Docs/Validation/PHASE_0_VALIDATION.md.
          EOF

          echo "apk_path=${APK_PATH}" >> "${GITHUB_OUTPUT}"
          echo "apk_dir=${APK_DIR}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=BeyondTheBeat-Phase0-${GITHUB_RUN_NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${APK_SHA256}" >> "${GITHUB_OUTPUT}"

      - name: Upload shareable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.manifest.outputs.artifact_name }}
          path: |
            ${{ steps.manifest.outputs.apk_path }}
            ${{ steps.manifest.outputs.apk_dir }}/Phase0-Artifact-Manifest.txt
            ${{ steps.manifest.outputs.apk_dir }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Write workflow summary
        shell: bash
        run: |
          {
            echo "## Beyond The Beat — Phase 0 Android APK"
            echo
            echo "- Artifact: \`${{ steps.manifest.outputs.artifact_name }}\`"
            echo "- APK: \`${{ steps.manifest.outputs.apk_path }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- SHA-256: \`${{ steps.manifest.outputs.sha256 }}\`"
            echo "- Status: APK generated; real Android device validation is still required."
          } >> "${GITHUB_STEP_SUMMARY}"
