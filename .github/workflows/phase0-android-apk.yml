name: Phase 0 Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/phase0-android-apk.yml'
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - 'Docs/Validation/**'

permissions:
  contents: read

concurrency:
  group: phase0-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    if: ${{ github.event_name != 'pull_request' || (!startsWith(github.head_ref, 'phase2/') && !startsWith(github.head_ref, 'phase3/') && !startsWith(github.head_ref, 'phase4/') && !startsWith(github.head_ref, 'hotfix/')) }}
    name: Build shareable Phase 0 APK
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Unity license configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${UNITY_LICENSE:-}" && -z "${UNITY_SERIAL:-}" ]]; then
            echo "::error::Configure UNITY_LICENSE for Unity Personal, or UNITY_SERIAL for a paid Unity license."
            exit 1
          fi

          if [[ -z "${UNITY_EMAIL:-}" || -z "${UNITY_PASSWORD:-}" ]]; then
            echo "::error::GameCI Unity Builder requires UNITY_EMAIL and UNITY_PASSWORD together with UNITY_LICENSE/UNITY_SERIAL for activation. If your Unity account uses Google sign-in, create/reset a direct Unity ID password for the same email and store it only as a GitHub Actions secret."
            exit 1
          fi

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Phase0-Android-v2-${{ hashFiles('Assets/**/*.cs', 'Assets/**/*.asmdef', 'Assets/**/*.asmref', 'Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}

      - name: Generate, validate, and build Android development APK
        id: unity-build
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ env.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ env.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ env.UNITY_SERIAL }}
        with:
          targetPlatform: Android
          unityVersion: auto
          buildMethod: BeyondTheBeat.Editor.Phase0BuildAutomation.BuildAndroid
          buildName: BeyondTheBeat-Phase0-${{ github.run_number }}
          buildsPath: build
          versioning: Custom
          version: 0.0.${{ github.run_number }}
          androidVersionCode: ${{ github.run_number }}
          androidExportType: androidPackage
          allowDirtyBuild: true

      - name: Print Phase 0 Unity diagnostics
        if: always()
        shell: bash
        run: |
          echo "=== Beyond The Beat Phase 0 Unity diagnostics ==="
          DIAGNOSTICS="${GITHUB_WORKSPACE}/build/phase0-ci-diagnostics.log"
          if [[ -f "${DIAGNOSTICS}" ]]; then
            echo "--- key CI events/errors ---"
            grep -E '\[Beyond The Beat\]|\[ERROR\]|\[EXCEPTION\]|\[ASSERT\]|\[FAIL\]|Exception|BuildResult' "${DIAGNOSTICS}" || true
            echo "--- diagnostics tail ---"
            tail -n 200 "${DIAGNOSTICS}"
          else
            echo "No Phase 0 diagnostics file was produced. Unity may have failed before the custom build method started."
          fi

      - name: Upload Phase 0 Unity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Phase0-CI-Diagnostics-${{ github.run_number }}
          path: build/phase0-ci-diagnostics.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Create artifact manifest and checksum
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="BeyondTheBeat-Phase0-${GITHUB_RUN_NUMBER}.apk"
          APK_PATH="$(find "${GITHUB_WORKSPACE}" -type f -name "${EXPECTED_APK}" -not -path "${GITHUB_WORKSPACE}/artifact/*" -not -path "${GITHUB_WORKSPACE}/Library/*" -print -quit)"
          if [[ -z "${APK_PATH}" ]]; then
            APK_PATH="$(find "${GITHUB_WORKSPACE}" -type f -name '*.apk' -not -path "${GITHUB_WORKSPACE}/artifact/*" -not -path "${GITHUB_WORKSPACE}/Library/*" -print -quit)"
          fi
          if [[ -z "${APK_PATH}" || ! -f "${APK_PATH}" ]]; then
            echo "::error::Unity completed without a discoverable APK in the GitHub workspace."
            find "${GITHUB_WORKSPACE}" -type f -name '*.apk' -not -path "${GITHUB_WORKSPACE}/Library/*" -print || true
            exit 1
          fi
          STAGE_DIR="${GITHUB_WORKSPACE}/artifact/Phase0"
          rm -rf "${STAGE_DIR}"
          mkdir -p "${STAGE_DIR}"
          APK_FILE="BeyondTheBeat-Phase0-${GITHUB_RUN_NUMBER}.apk"
          STAGED_APK="${STAGE_DIR}/${APK_FILE}"
          cp "${APK_PATH}" "${STAGED_APK}"
          APK_SIZE_BYTES="$(stat -c%s "${STAGED_APK}")"
          APK_SHA256="$(sha256sum "${STAGED_APK}" | awk '{print $1}')"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          UNITY_VERSION="$(awk -F': ' '/^m_EditorVersion:/{print $2; exit}' "${GITHUB_WORKSPACE}/ProjectSettings/ProjectVersion.txt")"
          printf '%s  %s\n' "${APK_SHA256}" "${APK_FILE}" > "${STAGE_DIR}/SHA256SUMS.txt"
          cat > "${STAGE_DIR}/Phase0-Artifact-Manifest.txt" <<EOF
          Beyond The Beat — Phase 0 Android Artifact
          Artifact name: BeyondTheBeat-Phase0-${GITHUB_RUN_NUMBER}
          APK file: ${APK_FILE}
          APK size (bytes): ${APK_SIZE_BYTES}
          SHA-256: ${APK_SHA256}
          Source commit SHA: ${SOURCE_SHA}
          Workflow checkout SHA: ${GITHUB_SHA}
          Git ref: ${GITHUB_REF}
          GitHub Actions run: ${RUN_URL}
          Unity version: ${UNITY_VERSION}
          Build type: Unity Development APK
          Unity APK source: ${APK_PATH}
          Generated UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          IMPORTANT: Artifact generation does not equal Android device validation.
          EOF
          {
            echo "artifact_name=BeyondTheBeat-Phase0-${GITHUB_RUN_NUMBER}"
            echo "apk_file=${APK_FILE}"
            echo "apk_path=artifact/Phase0/${APK_FILE}"
            echo "sha256=${APK_SHA256}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload shareable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.manifest.outputs.artifact_name }}
          path: |
            artifact/Phase0/BeyondTheBeat-Phase0-${{ github.run_number }}.apk
            artifact/Phase0/Phase0-Artifact-Manifest.txt
            artifact/Phase0/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Write workflow summary
        shell: bash
        run: |
          {
            echo "## Beyond The Beat — Phase 0 Android APK"
            echo
            echo "- Artifact: \`${{ steps.manifest.outputs.artifact_name }}\`"
            echo "- APK: \`${{ steps.manifest.outputs.apk_path }}\`"
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- Workflow checkout: \`${GITHUB_SHA}\`"
            echo "- SHA-256: \`${{ steps.manifest.outputs.sha256 }}\`"
            echo "- Status: APK generated; real Android device validation is still required."
          } >> "${GITHUB_STEP_SUMMARY}"
