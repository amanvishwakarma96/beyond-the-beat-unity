name: Phase 1 MVP Exit Android

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/phase1-world-foundation.yml'
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - 'Docs/**'

permissions:
  contents: read

concurrency:
  group: phase1-mvp-exit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mvp-exit:
    if: ${{ github.event_name != 'pull_request' || (!startsWith(github.head_ref, 'phase2/') && github.head_ref != 'hotfix/android-controls-presentation') }}
    name: Build Phase 1 MVP exit candidate APK
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Unity license configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${UNITY_LICENSE:-}" && -z "${UNITY_SERIAL:-}" ]]; then
            echo "::error::Configure UNITY_LICENSE for Unity Personal, or UNITY_SERIAL for a paid Unity license."
            exit 1
          fi
          if [[ -z "${UNITY_EMAIL:-}" || -z "${UNITY_PASSWORD:-}" ]]; then
            echo "::error::GameCI Unity Builder requires UNITY_EMAIL and UNITY_PASSWORD together with UNITY_LICENSE/UNITY_SERIAL."
            exit 1
          fi

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Phase1-MvpExit-v1-${{ hashFiles('Assets/**/*.cs', 'Assets/**/*.asmdef', 'Assets/**/*.asmref', 'Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}

      - name: Generate, validate, and build Phase 1 MVP exit candidate
        id: unity-build
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ env.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ env.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ env.UNITY_SERIAL }}
        with:
          targetPlatform: Android
          unityVersion: auto
          buildMethod: BeyondTheBeat.Editor.Phase1BuildAutomation.BuildAndroid
          buildName: BeyondTheBeat-Phase1-MVP-${{ github.run_number }}
          buildsPath: build
          versioning: Custom
          version: 0.1.${{ github.run_number }}
          androidVersionCode: ${{ github.run_number }}
          androidExportType: androidPackage
          allowDirtyBuild: true

      - name: Print Phase 1 exit diagnostics
        if: always()
        shell: bash
        run: |
          echo "=== Beyond The Beat Phase 1 MVP exit diagnostics ==="
          DIAGNOSTICS="${GITHUB_WORKSPACE}/build/phase1-ci-diagnostics.log"
          if [[ -f "${DIAGNOSTICS}" ]]; then
            grep -E '\[Beyond The Beat\]|Exception|BuildResult|FAIL|PASS|REQUIRED' "${DIAGNOSTICS}" || true
            echo "--- diagnostics tail ---"
            tail -n 320 "${DIAGNOSTICS}"
          else
            echo "No Phase 1 diagnostics file was produced."
          fi

      - name: Upload Phase 1 exit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Phase1-MVP-Exit-CI-Diagnostics-${{ github.run_number }}
          path: build/phase1-ci-diagnostics.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Create Phase 1 MVP artifact manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="BeyondTheBeat-Phase1-MVP-${GITHUB_RUN_NUMBER}.apk"
          APK_PATH="$(find "${GITHUB_WORKSPACE}" -type f -name "${EXPECTED_APK}" -not -path "${GITHUB_WORKSPACE}/artifact/*" -not -path "${GITHUB_WORKSPACE}/Library/*" -print -quit)"
          if [[ -z "${APK_PATH}" ]]; then
            APK_PATH="$(find "${GITHUB_WORKSPACE}" -type f -name '*.apk' -not -path "${GITHUB_WORKSPACE}/artifact/*" -not -path "${GITHUB_WORKSPACE}/Library/*" -print -quit)"
          fi
          if [[ -z "${APK_PATH}" || ! -f "${APK_PATH}" ]]; then
            echo "::error::Unity completed without a discoverable Phase 1 MVP APK."
            find "${GITHUB_WORKSPACE}" -type f -name '*.apk' -print || true
            exit 1
          fi
          STAGE_DIR="${GITHUB_WORKSPACE}/artifact/Phase1MVP"
          rm -rf "${STAGE_DIR}"
          mkdir -p "${STAGE_DIR}"
          APK_FILE="BeyondTheBeat-Phase1-MVP-${GITHUB_RUN_NUMBER}.apk"
          STAGED_APK="${STAGE_DIR}/${APK_FILE}"
          cp "${APK_PATH}" "${STAGED_APK}"
          APK_SIZE_BYTES="$(stat -c%s "${STAGED_APK}")"
          APK_SHA256="$(sha256sum "${STAGED_APK}" | awk '{print $1}')"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          UNITY_VERSION="$(awk -F': ' '/^m_EditorVersion:/{print $2; exit}' "${GITHUB_WORKSPACE}/ProjectSettings/ProjectVersion.txt")"
          printf '%s  %s\n' "${APK_SHA256}" "${APK_FILE}" > "${STAGE_DIR}/SHA256SUMS.txt"
          cat > "${STAGE_DIR}/Phase1-MVP-Artifact-Manifest.txt" <<EOF
          Beyond The Beat — Phase 1 MVP Exit Candidate
          Artifact name: BeyondTheBeat-Phase1-MVP-${GITHUB_RUN_NUMBER}
          APK file: ${APK_FILE}
          APK size (bytes): ${APK_SIZE_BYTES}
          SHA-256: ${APK_SHA256}
          Source commit SHA: ${SOURCE_SHA}
          Workflow checkout SHA: ${GITHUB_SHA}
          GitHub Actions run: ${RUN_URL}
          Unity version: ${UNITY_VERSION}
          Build type: Unity Development APK
          Generated UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          IMPORTANT: CI success proves deterministic generation/validation/build only.
          EOF
          {
            echo "artifact_name=BeyondTheBeat-Phase1-MVP-${GITHUB_RUN_NUMBER}"
            echo "apk_path=artifact/Phase1MVP/${APK_FILE}"
            echo "sha256=${APK_SHA256}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload Phase 1 MVP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.manifest.outputs.artifact_name }}
          path: |
            artifact/Phase1MVP/BeyondTheBeat-Phase1-MVP-${{ github.run_number }}.apk
            artifact/Phase1MVP/Phase1-MVP-Artifact-Manifest.txt
            artifact/Phase1MVP/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Write workflow summary
        shell: bash
        run: |
          {
            echo "## Beyond The Beat — Phase 1 MVP Exit Candidate"
            echo
            echo "- Artifact: \`${{ steps.manifest.outputs.artifact_name }}\`"
            echo "- APK: \`${{ steps.manifest.outputs.apk_path }}\`"
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- SHA-256: \`${{ steps.manifest.outputs.sha256 }}\`"
            echo "- Final Phase 1 sign-off: pending physical Android validation report."
          } >> "${GITHUB_STEP_SUMMARY}"
