name: Fast Current Milestone Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/fast-current-milestone-validation.yml'
      - '.github/workflows/phase2-forest-foundation.yml'
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - 'Docs/**'

permissions:
  contents: read

concurrency:
  group: fast-current-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-current-milestone:
    name: Fast Unity validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Unity license configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${UNITY_LICENSE:-}" && -z "${UNITY_SERIAL:-}" ]]; then
            echo "::error::Configure UNITY_LICENSE for Unity Personal, or UNITY_SERIAL for a paid Unity license."
            exit 1
          fi
          if [[ -z "${UNITY_EMAIL:-}" || -z "${UNITY_PASSWORD:-}" ]]; then
            echo "::error::GameCI Unity Builder requires UNITY_EMAIL and UNITY_PASSWORD together with UNITY_LICENSE/UNITY_SERIAL."
            exit 1
          fi

      - name: Restore incremental Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-Fast-v2-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            Library-Android-Fast-v2-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-Android-Fast-v1-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-Android-Full-v2-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-Android-Full-v1-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-CurrentAndroidTest-v5-

      - name: Compile and run fast milestone contracts
        uses: game-ci/unity-builder@v5.0.0
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ env.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ env.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ env.UNITY_SERIAL }}
        with:
          targetPlatform: Android
          unityVersion: auto
          buildMethod: BeyondTheBeat.Editor.Phase6PerformanceFastValidation.Validate
          buildsPath: build/fast-validation
          allowDirtyBuild: true

      - name: Write validation summary
        if: success()
        shell: bash
        run: |
          {
            echo "# Fast Phase 6 Optimization + Onboarding Validation"
            echo
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- Unity script compilation: **PASS**"
            echo "- Phase 5 gameplay contracts: **PASS**"
            echo "- Performance budget / sampled diagnostics: **PASS**"
            echo "- Mobile render-quality profile: **PASS**"
            echo "- Engine / managed stripping policy: **PASS**"
            echo "- LZ4HC build-option composition: **PASS**"
            echo "- BuildReport size diagnostics code: **PASS**"
            echo "- Tutorial ordered control progression: **PASS**"
            echo "- Tutorial wrong-input rejection / Skip behavior: **PASS**"
            echo "- Tutorial HUD no-Update presentation contract: **PASS**"
            echo "- Historical scene rebuild: **NOT RUN**"
            echo "- Android APK packaging: **NOT RUN in PR validation**"
            echo
            echo "The full **Current Android Test Build** starts automatically after the PR is merged to main and can also be run manually."
            echo "Its APK size must be compared with the 41.25 MB TEST-THIS-BUILD-48 baseline."
            echo "Physical Android first-launch/tutorial readability/touch/regression testing remains mandatory; CI cannot prove onboarding ergonomics or runtime-only stripping behavior."
          } >> "${GITHUB_STEP_SUMMARY}"
